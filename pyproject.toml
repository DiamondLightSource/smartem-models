[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "smartem-models"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]
description = "Model repository for smartEM automated cryoEM SPA acquisition"
dependencies = [
    "argparse",    
    "backports.entry_points_selectable",
    "pika==1.3.2",
    "pydantic==2.11.3",
    "typer==0.16.0",
    "mrcfile",
    "tifffile",
]
dynamic = ["version"]
license.file = "LICENSE"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
torchgpu = [
    "scikit-learn",
    "torch",
    "torchvision",
]
torchcpu = [
    "scikit-learn",
    "torch",
    "torchvision",
]
escnn = ["escnn==1.0.11"]


[project.scripts]
"smartem_models.service" = "smartem_models.cli.service:run"
"smartem_models.consumer" = "smartem_models.consumer:run"

[project.entry-points."smartem_models.grid.registered"]
"resnet-atlas" = "smartem_models.resnet_classifier.service:infer"
"dae-atlas" = "smartem_models.clustering.service_atlas:initialise"
"dae-square-init" = "smartem_models.clustering.service:initialise"
"dae-square-infer" = "smartem_models.clustering.service:infer"
"dae-square-update" = "smartem_models.clustering.service:update"

[project.entry-points."smartem_models.gridsquare.registered"]
"resnet-holes" = "smartem_models.resnet_classifier.service_holes:infer"
"dae-hole-init" = "smartem_models.clustering.service_holes:initialise"
"dae-hole-infer" = "smartem_models.clustering.service_holes:infer"
"dae-hole-update" = "smartem_models.clustering.service_holes:update"

[project.entry-points."smartem_models.grid.registered.signature"]
"resnet-atlas" = "smartem_models.resnet_classifier.parameter_models:InferenceParameters"
"dae-atlas" ="smartem_models.clustering.parameter_models_atlas:InitParameters"
"dae-square-init" ="smartem_models.clustering.parameter_models:InitParameters"
"dae-square-infer" ="smartem_models.clustering.parameter_models:InferenceParameters"
"dae-square-update" ="smartem_models.clustering.parameter_models:UpdateParameters"

[project.entry-points."smartem_models.gridsquare.registered.signature"]
"resnet-holes" = "smartem_models.resnet_classifier.parameter_models:HoleInferenceParameters"
"dae-hole-init" ="smartem_models.clustering.parameter_models_holes:InitParameters"
"dae-hole-infer" ="smartem_models.clustering.parameter_models_holes:InferenceParameters"
"dae-hole-update" ="smartem_models.clustering.parameter_models_holes:UpdateParameters"

[project.urls]
GitHub = "https://github.com/DiamondLightSource/smartem-models"

[[project.authors]] # Further authors may be added by duplicating this section
email = "daniel.hatton@diamond.ac.uk"
name = "Daniel Hatton"

[[project.authors]] # Further authors may be added by duplicating this section
email = "jaehoon.cha@stfc.ac.uk"
name = "Jaehoon Cha"

[[project.authors]] # Further authors may be added by duplicating this section
email = "val.redchenko@diamond.ac.uk"
name = "Val Redchenko"

[tool.uv]
no-build-isolation-package = ["escnn"]
conflicts = [
  [
    { extra = "torchcpu" },
    { extra = "torchgpu" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "torchcpu" },
  { index = "pytorch-cu126", extra = "torchgpu" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "torchcpu" },
  { index = "pytorch-cu126", extra = "torchgpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/_version.py"

[tool.pyright]
typeCheckingMode = "standard"
reportMissingImports = false # Ignore missing stubs in imported modules

[tool.pytest.ini_options]
# Run pytest with all our checkers, and don't spam us with massive tracebacks on error
addopts = """
    --tb=native -vv --doctest-modules --doctest-glob="*.rst"
    """
# https://iscinumpy.gitlab.io/post/bound-version-constraints/#watch-for-warnings
filterwarnings = "error"
# Doctest python code in docs, python code in src docstrings, test functions in tests
testpaths = "docs src tests"

[tool.coverage.run]
data_file = "/tmp/core.coverage"

[tool.coverage.paths]
# Tests are run from installed location, map back to the src directory
source = ["src", "**/site-packages/"]

# tox must currently be configured via an embedded ini string
# See: https://github.com/tox-dev/tox/issues/999
[tool.tox]
legacy_tox_ini = """
[tox]
skipsdist=False
# Add setuptools to the build requirements
requires = setuptools>=64.0.0

[testenv:{pre-commit,type-checking,tests,docs}]
exclude = docs/assets/
extras =
    tests: dev
    docs: dev
    pre-commit: dev
    type-checking: dev
commands_pre =
    pip install -e .[all]
passenv = *
allowlist_externals =
    pytest
    pre-commit
    pyright
    sphinx-build
    sphinx-autobuild
    pip
commands =
    pre-commit: pre-commit run --all-files --show-diff-on-failure {posargs}
    type-checking: pyright src tests {posargs}
    tests: pytest {posargs}
    docs: sphinx-{posargs:build -E --keep-going} -T docs build/html
"""
# To treat warnings as errors: `docs: sphinx-{posargs:build -EW --keep-going} -T docs build/html`

[tool.ruff]
src = ["src", "tests"]
line-length = 120
lint.select = [
    "B",   # flake8-bugbear - https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "C4",  # flake8-comprehensions - https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    "E",   # pycodestyle errors - https://docs.astral.sh/ruff/rules/#error-e
    "F",   # pyflakes rules - https://docs.astral.sh/ruff/rules/#pyflakes-f
    "W",   # pycodestyle warnings - https://docs.astral.sh/ruff/rules/#warning-w
    "I",   # isort - https://docs.astral.sh/ruff/rules/#isort-i
    "UP",  # pyupgrade - https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "SLF", # self - https://docs.astral.sh/ruff/settings/#lintflake8-self
]
lint.ignore = ["SLF001"]
