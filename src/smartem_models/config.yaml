registered_models:
  - resnet-atlas
  - resnet-holes
  - dae-atlas
  - dae-holes

processing_queues:
  resnet-atlas: 
    grid.registered: resnet_atlas_infer
  resnet-holes:
    gridsquare.created: resnet_holes_infer
    gridsquare.updated: resnet_holes_infer
  dae-atlas:
    grid.registered: dae_atlas_init
  dae-holes-init:
    gridsquare.registered: dae_hole_init
  dae-holes-infer:
    gridsquare.registered: dae_hole_infer

distributed:
  resnet-atlas: 
    grid.registered: false
  resnet-holes: 
    gridsquare.created: false
    gridsquare.updated: false
  dae-atlas:
    grid.registered: true
  dae-holes-init:
    gridsquare.registered: true
  dae-holes-infer:
    gridsquare.registered: true

model_parameters:
  resnet-atlas:
    grid.registered:
      model_path: "/path/to/weights"
  resnet-holes:
    gridsquare.created:
      model_path: "/path/to/weights"
    gridsquare.updated:
      model_path: "/path/to/weights"
  dae-atlas:
    grid.registered:
      model_path: "/path/to/starting/weights"
  dae-holes-init:
    gridsquare.registered:
      model_path: "/path/to/starting/weights"
  dae-holes-infer:
    gridsquare.registered:
      model_path: "/path/to/starting/weights"

act_on_count:
  dae-holes-init:
    gridsquare.registered:
      - 5

  minimum_count:
    dae-holes-infer:
      gridsquare.registered: 6
